name: CI

# ==========================================
# ТРИГГЕРЫ ЗАПУСКА
# ==========================================
on:
  push:
    branches:
      - main
      - 'feature/**'  # Все ветки, начинающиеся с feature/
  pull_request:
    branches:
      - main
      - 'feature/**'

# ==========================================
# ОКРУЖЕНИЕ (опционально)
# ==========================================
#env:
#  GO_VERSION: '1.20'
#  GOLANGCI_LINT_VERSION: 'v1.54.2'

# ==========================================
# JOBS - ОСНОВНЫЕ ЭТАПЫ CI
# ==========================================
jobs:
  # ==========================================
  # JOB 1: ЛИНТЕР И ТЕСТЫ
  # ==========================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest  # ОС для запуска (Ubuntu)
    
    # ==========================================
    # СЕРВИСЫ ДЛЯ ТЕСТОВ
    # ==========================================
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventdb_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    # ==========================================
    # ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ
    # ==========================================
    env:
      CONFIG_PATH: int-tests/config.ci.yaml
    
    # ==========================================
    # ШАГИ (STEPS)
    # ==========================================
    steps:
      # ------------------------------------------
      # Шаг 1: Клонирование репозитория
      # ------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        # v4 - версия action (рекомендуется всегда указывать)
        # Что делает: клонирует код репозитория в runner
      
      # ------------------------------------------
      # Шаг 2: Установка Go
      # ------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          # Версия Go, которую мы хотим использовать
          cache: true
          # ⭐ ВКЛЮЧАЕТ АВТОМАТИЧЕСКОЕ КЕШИРОВАНИЕ go.mod!
      
      # ------------------------------------------
      # Шаг 3: Установка golangci-lint
      # ------------------------------------------
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
      
      # ------------------------------------------
      # Шаг 4: Запуск линтера
      # ------------------------------------------
      - name: Run golangci-lint
        run: |
          $(go env GOPATH)/bin/golangci-lint run ./...
        # golangci-lint запускает множество линтеров:
        # - govet, staticcheck, errcheck, gosec, и т.д.
      
      # ------------------------------------------
      # Шаг 5: Скачать зависимости
      # ------------------------------------------
      - name: Download dependencies
        run: go mod download
        # Скачивает все зависимости из go.mod
        # Благодаря cache: true на шаге setup-go, зависимости будут кешированы
      
      # ------------------------------------------
      # Шаг 6: Запуск unit тестов
      # ------------------------------------------
      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...
        # -v - verbose вывод
        # -race - проверка на race conditions (гонки данных)
        # -coverprofile=coverage.out - генерирует отчёт о покрытии кода тестами
      
      # ------------------------------------------
      # Шаг 7: Запуск интеграционных тестов
      # ------------------------------------------
      - name: Run integration tests
        run: go test -v -tags=integration ./...
        # -tags=integration запускает только тесты с build tag integration
        # Например: // +build integration в начале файла теста
      
      # ------------------------------------------
      # Шаг 8: Загрузка coverage отчёта (опционально)
      # ------------------------------------------
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
        # Это опционально, если используете Codecov для визуализации покрытия

  # ==========================================
  # JOB 2: BUILD DOCKER ИМЕНЯ
  # ==========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test  # ⭐ Запускать только после успешного завершения lint-and-test
    
    steps:
      # ------------------------------------------
      # Шаг 1: Клонирование репозитория
      # ------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ------------------------------------------
      # Шаг 2: Установка Docker Buildx
      # ------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx - расширенный билдер Docker с поддержкой кеширования
      
      # ------------------------------------------
      # Шаг 3: Кеширование Docker слоёв
      # ------------------------------------------
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
        # ⭐ КЕШИРОВАНИЕ Docker слоёв для ускорения сборки
        # key: уникальный ключ для каждого коммита
        # restore-keys: ключи для восстановления кеша из предыдущих сборок
      
      # ------------------------------------------
      # Шаг 4: Сборка Docker образа (без пуша)
      # ------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: false  # ⭐ НЕ пушить образ в реестр
          tags: booking-service:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          # cache-from: восстанавливаем кеш
          # cache-to: сохраняем кеш после сборки
      
      # ------------------------------------------
      # Шаг 5: Перемещение кеша (оптимизация)
      # ------------------------------------------
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
        # Удаляем старый кеш и переименовываем новый
        # Это нужно, потому что GitHub Actions не умеет перезаписывать кеш
      
      # ------------------------------------------
      # Шаг 6: Проверка Docker образа
      # ------------------------------------------
      - name: Verify Docker image
        run: |
          docker images
          echo "Image built successfully!"